apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-fabrics
  labels:
    app: urban-fabrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urban-fabrics
  template:
    metadata:
      labels:
        app: urban-fabrics
    spec:
      containers:
        - name: web
          image: ${DOCKERHUB_NAMESPACE}/urban-fabrics:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
